<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
	<defs>
		<style>
			.text{font: 32px 'Roboto', Arial, sans-serif; fill:#e6edf3}
			.sub{font: 24px 'Roboto', Arial, sans-serif; fill:#9ca3af}
		</style>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#0b0f14"/>
			<stop offset="100%" stop-color="#0b0f14"/>
		</linearGradient>
	</defs>
	<rect x="0" y="0" width="1080" height="1920" fill="url(#bg)"/>
	<!-- Header -->
	<rect x="0" y="0" width="1080" height="140" fill="#111827"/>
	<text x="36" y="88" class="text">IPTV Player</text>
	<!-- Inputs mock -->
	<rect x="36" y="170" width="680" height="60" rx="10" fill="#0b0f14" stroke="#374151"/>
	<text x="56" y="210" class="sub">Base m3u8 URL</text>
	<rect x="36" y="250" width="280" height="60" rx="10" fill="#0b0f14" stroke="#374151"/>
	<text x="56" y="290" class="sub">Token key</text>
	<rect x="336" y="250" width="200" height="60" rx="10" fill="#0b0f14" stroke="#374151"/>
	<text x="356" y="290" class="sub">Algo: sha256</text>
	<rect x="36" y="330" width="680" height="60" rx="10" fill="#0b0f14" stroke="#374151"/>
	<text x="56" y="370" class="sub">Backup servers</text>
	<rect x="740" y="170" width="304" height="220" rx="12" fill="#2563eb"/>
	<text x="820" y="290" class="text" text-anchor="middle">Play</text>
	<!-- Video area -->
	<rect x="0" y="420" width="1080" height="1240" fill="#000"/>
	<polygon points="520,980 520,860 620,920" fill="#ffffff"/>
	<rect x="30" y="430" width="1020" height="80" fill="none" stroke="#1f2937"/>
	<rect x="30" y="1560" width="1020" height="80" fill="none" stroke="#1f2937"/>
	<text x="40" y="1630" class="sub">Status: Playing via server 1/3</text>
	<!-- Bottom bar -->
	<rect x="0" y="1780" width="1080" height="140" fill="#0b0f14"/>
	<text x="36" y="1860" class="sub">Sample mockup — not an actual screenshot</text>
</svg>